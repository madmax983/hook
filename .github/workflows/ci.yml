# Static CI. No org and no secret.
# format:        Prettier check of all Apex.
# node:          vector, API manifest and coverage script tests.
# apex-compile:  apex-ls compiles every package folder, with Revenant as a submodule.
# code-analyzer: Salesforce Code Analyzer. Fails at High (severity 2) or worse.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODE_ANALYZER_VERSION: "5.16.0"
  CODE_ANALYZER_FAIL_SEVERITY: "2"

jobs:
  format:
    name: Apex format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  apex-compile:
    name: Apex compile (apex-ls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch apex-ls
        run: bash scripts/apex-ls/fetch-apex-ls.sh
      - name: Compile
        run: npm run check:apex-compile
        env:
          REQUIRE_APEX_LS: "1"
          REQUIRE_SUBMODULES: "1"

  code-analyzer:
    name: Code Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli
          sf plugins install "code-analyzer@${CODE_ANALYZER_VERSION}"
      - name: Run
        run: |
          mkdir -p code-analyzer-results
          sf code-analyzer run \
            --workspace force-app --workspace revenant-adapter \
            --rule-selector recommended \
            --severity-threshold "$CODE_ANALYZER_FAIL_SEVERITY" \
            --output-file code-analyzer-results/results.html \
            --output-file code-analyzer-results/results.json
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer
          path: code-analyzer-results/
          if-no-files-found: ignore

  ci:
    name: CI
    if: always()
    needs: [format, node, apex-compile, code-analyzer]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::A CI job failed."
            exit 1
          fi
